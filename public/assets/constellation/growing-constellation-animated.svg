<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">HSDOS growing constellation</title>
  <desc id="desc">A central Inner Key star reveals family, learning, goal, and achievement nodes through calm blueprint paths.</desc>
  <defs>
    <radialGradient id="core" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".28" stop-color="#FFF8E1"/>
      <stop offset=".68" stop-color="#E9B95F"/>
      <stop offset="1" stop-color="#A9742D"/>
    </radialGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#426F9F"/>
      <stop offset=".5" stop-color="#9CCBFA"/>
      <stop offset="1" stop-color="#426F9F"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9742D"/>
      <stop offset=".5" stop-color="#F1C66F"/>
      <stop offset="1" stop-color="#A9742D"/>
    </linearGradient>
    <filter id="blueGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .route { fill:none; stroke:url(#blueLine); stroke-width:2.4; stroke-linecap:round; opacity:.82; stroke-dasharray:1100; stroke-dashoffset:1100; animation:draw 1.25s cubic-bezier(.4,0,.2,1) forwards; }
      .route.secondary { stroke-width:1.35; opacity:.38; }
      .route.gold { stroke:url(#goldLine); opacity:.9; }
      .r1 { animation-delay:1.1s; } .r2 { animation-delay:2.15s; }
      .r3 { animation-delay:3.15s; } .r4 { animation-delay:4.05s; }
      .r5 { animation-delay:4.7s; } .r6 { animation-delay:5.15s; }
      .node { opacity:0; transform-box:fill-box; transform-origin:center; transform:scale(.72); animation:reveal .72s cubic-bezier(.2,.85,.25,1.2) forwards; }
      .n1 { animation-delay:1.85s; } .n2 { animation-delay:2.85s; }
      .n3 { animation-delay:3.85s; } .n4 { animation-delay:4.75s; }
      .minor { opacity:0; animation:fade .65s ease forwards; }
      .m1 { animation-delay:2.5s; } .m2 { animation-delay:3.45s; }
      .m3 { animation-delay:4.35s; } .m4 { animation-delay:5.05s; }
      .seed { transform-box:fill-box; transform-origin:center; animation:seed 7s ease-in-out forwards; }
      .signal { opacity:0; animation:signalFade 2.6s ease 5.15s forwards; }
      .settle { opacity:0; animation:fade .9s ease 5.7s forwards; }
      @keyframes draw { to { stroke-dashoffset:0; } }
      @keyframes reveal { 0% { opacity:0; transform:scale(.72); } 65% { opacity:1; transform:scale(1.035); } 100% { opacity:1; transform:scale(1); } }
      @keyframes fade { to { opacity:1; } }
      @keyframes seed { 0%,10% { opacity:0; transform:scale(.65); } 18% { opacity:1; transform:scale(1.08); } 28%,100% { opacity:1; transform:scale(1); } }
      @keyframes signalFade { 0% {opacity:0} 12%,75% {opacity:1} 100% {opacity:0} }
      @media (prefers-reduced-motion: reduce) {
        * { animation:none !important; }
        .route { stroke-dashoffset:0; }
        .node,.minor,.seed,.settle { opacity:1; transform:none; }
        .signal { display:none; }
      }
    </style>
  </defs>

  <!-- Sparse registration field -->
  <g fill="#CFE5FA" opacity=".42">
    <circle cx="164" cy="184" r="2"/><circle cx="256" cy="705" r="1.7"/>
    <circle cx="668" cy="118" r="1.8"/><circle cx="947" cy="774" r="1.6"/>
    <circle cx="1378" cy="171" r="1.6"/><circle cx="1451" cy="538" r="2"/>
  </g>

  <!-- Growing blueprint routes -->
  <path class="route r1" d="M741 421 C646 365 548 308 454 274"/>
  <path class="route r2" d="M859 419 C954 357 1030 288 1138 253"/>
  <path class="route r3" d="M860 482 C976 536 1071 611 1186 649"/>
  <path class="route gold r4" d="M741 482 C633 540 548 613 438 666"/>
  <path class="route secondary r5" d="M454 274 C663 178 927 171 1138 253"/>
  <path class="route secondary r6" d="M438 666 C657 767 973 760 1186 649"/>

  <!-- Minor stars -->
  <g class="minor m1" transform="translate(602 350)"><circle r="4" fill="url(#core)" filter="url(#blueGlow)"/><path d="M-16 0H16M0-16V16" stroke="#D9EDFF" stroke-width="1" opacity=".5"/></g>
  <g class="minor m2" transform="translate(1007 342)"><circle r="4" fill="url(#core)" filter="url(#blueGlow)"/><path d="M-14 0H14M0-14V14" stroke="#D9EDFF" stroke-width="1" opacity=".45"/></g>
  <g class="minor m3" transform="translate(1025 563)"><circle r="4" fill="url(#core)" filter="url(#blueGlow)"/><path d="M-14 0H14M0-14V14" stroke="#D9EDFF" stroke-width="1" opacity=".45"/></g>
  <g class="minor m4" transform="translate(588 568)"><circle r="4" fill="url(#core)" filter="url(#goldGlow)"/><path d="M-15 0H15M0-15V15" stroke="#F1C66F" stroke-width="1" opacity=".5"/></g>

  <!-- Central Inner Key seed -->
  <g class="seed" transform="translate(800 450)">
    <circle r="74" fill="none" stroke="#B9893E" stroke-width="1.5" opacity=".6"/>
    <circle r="58" fill="none" stroke="#6D94BD" stroke-width="1" stroke-dasharray="72 15 28 18" opacity=".55"/>
    <circle r="42" fill="#07162D" fill-opacity=".72" stroke="#D7A84E" stroke-width="2"/>
    <path d="M0-35 L8-8 L35 0 L8 8 L0 35 L-8 8 L-35 0 L-8-8 Z" fill="url(#core)" filter="url(#goldGlow)"/>
    <circle cx="0" cy="-74" r="4" fill="#FFF8E1"/><circle cx="74" cy="0" r="4" fill="#E9B95F"/>
    <circle cx="0" cy="74" r="4" fill="#FFF8E1"/><circle cx="-74" cy="0" r="4" fill="#E9B95F"/>
  </g>

  <!-- Family -->
  <g class="node n1" transform="translate(390 250)">
    <circle r="78" fill="#07162D" fill-opacity=".72" stroke="#D7A84E" stroke-width="2"/>
    <circle r="65" fill="none" stroke="#739BC3" stroke-width="1" stroke-dasharray="58 12 24 10" opacity=".6"/>
    <circle cy="-22" r="13" fill="url(#core)" filter="url(#goldGlow)"/>
    <circle cx="-28" cy="25" r="12" fill="url(#core)"/><circle cx="28" cy="25" r="12" fill="url(#core)"/>
    <path d="M0-9 C-7 3-17 12-24 18 M0-9 C7 3 17 12 24 18 M-17 29 Q0 43 17 29" fill="none" stroke="#E9B95F" stroke-width="2"/>
    <circle cy="-78" r="4" fill="#FFF8E1"/><circle cx="78" r="4" fill="#E9B95F"/><circle cy="78" r="4" fill="#FFF8E1"/><circle cx="-78" r="4" fill="#E9B95F"/>
  </g>

  <!-- Learning -->
  <g class="node n2" transform="translate(1210 230)">
    <circle r="78" fill="#07162D" fill-opacity=".72" stroke="#D7A84E" stroke-width="2"/>
    <circle r="65" fill="none" stroke="#739BC3" stroke-width="1" stroke-dasharray="58 12 24 10" opacity=".6"/>
    <path d="M-46-34 Q-19-38 0-21 Q19-38 46-34 V38 Q20 33 0 50 Q-20 33-46 38 Z" fill="#0A2449" stroke="#E9B95F" stroke-width="2"/>
    <path d="M0-20V49 M-36-24 Q-17-25-7-15 M36-24 Q17-25 7-15" fill="none" stroke="#83B9EC" stroke-width="1.5"/>
    <circle cy="-78" r="4" fill="#FFF8E1"/><circle cx="78" r="4" fill="#E9B95F"/><circle cy="78" r="4" fill="#FFF8E1"/><circle cx="-78" r="4" fill="#E9B95F"/>
  </g>

  <!-- Goal -->
  <g class="node n3" transform="translate(1260 680)">
    <circle r="78" fill="#07162D" fill-opacity=".72" stroke="#D7A84E" stroke-width="2"/>
    <circle r="65" fill="none" stroke="#739BC3" stroke-width="1" stroke-dasharray="58 12 24 10" opacity=".6"/>
    <circle r="43" fill="none" stroke="#B8893D" stroke-width="2"/><circle r="23" fill="none" stroke="#6F9BC6" stroke-width="1.5"/>
    <path d="M0 0 L35-41" stroke="#FFF8E1" stroke-width="4" stroke-linecap="round" filter="url(#goldGlow)"/>
    <circle cx="35" cy="-41" r="5" fill="#E9B95F"/><circle r="7" fill="url(#core)"/>
    <circle cy="-78" r="4" fill="#FFF8E1"/><circle cx="78" r="4" fill="#E9B95F"/><circle cy="78" r="4" fill="#FFF8E1"/><circle cx="-78" r="4" fill="#E9B95F"/>
  </g>

  <!-- Achievement -->
  <g class="node n4" transform="translate(390 680)">
    <circle r="78" fill="#07162D" fill-opacity=".72" stroke="#E9B95F" stroke-width="2.5" filter="url(#goldGlow)"/>
    <circle r="65" fill="none" stroke="#D7A84E" stroke-width="1" stroke-dasharray="58 12 24 10" opacity=".7"/>
    <path d="M0-46 L11-14 L45-14 L18 6 L28 39 L0 20 L-28 39 L-18 6 L-45-14 L-11-14 Z" fill="url(#core)" filter="url(#goldGlow)"/>
    <circle cy="-78" r="4" fill="#FFF8E1"/><circle cx="78" r="4" fill="#E9B95F"/><circle cy="78" r="4" fill="#FFF8E1"/><circle cx="-78" r="4" fill="#E9B95F"/>
  </g>

  <!-- One restrained travelling signal -->
  <circle class="signal" r="7" fill="#FFF8E1" stroke="#D7A84E" stroke-width="2" filter="url(#goldGlow)">
    <animateMotion begin="5.15s" dur="2.2s" fill="freeze" path="M741 482 C633 540 548 613 438 666"/>
  </circle>

  <!-- Settled registration arcs -->
  <g class="settle" fill="none" stroke="#6E93B8" stroke-width="1" opacity=".28">
    <path d="M690 450 A110 110 0 0 1 910 450"/>
    <path d="M720 532 A110 110 0 0 0 880 532"/>
  </g>
</svg>
