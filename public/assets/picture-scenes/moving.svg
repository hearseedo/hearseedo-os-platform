<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#efe6d8"/>
  <rect y="0" width="800" height="30" fill="#d9cbb2"/>
  <!-- floor -->
  <rect y="420" width="800" height="80" fill="#c9a876"/>

  <!-- window -->
  <rect x="600" y="60" width="160" height="180" rx="6" fill="#bfe6f5" stroke="#8a6f4c" stroke-width="8"/>
  <line x1="680" y1="60" x2="680" y2="240" stroke="#8a6f4c" stroke-width="6"/>
  <line x1="600" y1="150" x2="760" y2="150" stroke="#8a6f4c" stroke-width="6"/>

  <!-- half-assembled shelf -->
  <g>
    <rect x="60" y="150" width="140" height="14" fill="#8a6f4c"/>
    <rect x="60" y="230" width="140" height="14" fill="#8a6f4c"/>
    <rect x="60" y="150" width="14" height="94" fill="#8a6f4c"/>
    <rect x="186" y="150" width="14" height="94" fill="#8a6f4c"/>
  </g>

  <!-- boxes everywhere -->
  <g>
    <rect x="230" y="330" width="90" height="80" fill="#d3a86a"/>
    <rect x="230" y="330" width="90" height="16" fill="#b98950"/>
    <line x1="230" y1="370" x2="320" y2="370" stroke="#8a6f4c" stroke-width="4"/>
    <line x1="275" y1="330" x2="275" y2="410" stroke="#8a6f4c" stroke-width="4"/>
  </g>
  <g>
    <rect x="330" y="360" width="70" height="60" fill="#e2b877"/>
    <rect x="330" y="360" width="70" height="12" fill="#b98950"/>
    <line x1="365" y1="360" x2="365" y2="420" stroke="#8a6f4c" stroke-width="4"/>
  </g>
  <g>
    <rect x="80" y="360" width="80" height="70" fill="#d3a86a"/>
    <rect x="80" y="360" width="80" height="14" fill="#b98950"/>
    <line x1="120" y1="360" x2="120" y2="430" stroke="#8a6f4c" stroke-width="4"/>
  </g>
  <g>
    <rect x="450" y="380" width="60" height="50" fill="#e2b877"/>
    <rect x="450" y="380" width="60" height="10" fill="#b98950"/>
  </g>
  <g>
    <rect x="540" y="350" width="65" height="80" fill="#d3a86a"/>
    <rect x="540" y="350" width="65" height="14" fill="#b98950"/>
    <text x="572" y="395" font-family="sans-serif" font-size="12" fill="#5b4636" text-anchor="middle">KITCHEN</text>
  </g>

  <!-- stacked boxes -->
  <g>
    <rect x="650" y="330" width="70" height="60" fill="#e2b877"/>
    <rect x="650" y="330" width="70" height="12" fill="#b98950"/>
    <rect x="655" y="270" width="60" height="55" fill="#d3a86a"/>
    <rect x="655" y="270" width="60" height="12" fill="#b98950"/>
  </g>

  <!-- couch half in place -->
  <g>
    <rect x="380" y="270" width="150" height="60" rx="10" fill="#a44b4b"/>
    <rect x="380" y="240" width="150" height="40" rx="10" fill="#b95c5c"/>
    <rect x="368" y="290" width="18" height="40" rx="6" fill="#8a3f3f"/>
    <rect x="524" y="290" width="18" height="40" rx="6" fill="#8a3f3f"/>
  </g>

  <!-- person carrying a box -->
  <g>
    <circle cx="210" cy="260" r="17" fill="#e8b48c"/>
    <rect x="180" y="270" width="60" height="45" rx="6" fill="#d3a86a"/>
    <rect x="192" y="316" width="16" height="60" rx="6" fill="#2b3a67"/>
    <rect x="216" y="316" width="16" height="60" rx="6" fill="#2b3a67"/>
  </g>

  <!-- tape roll on floor -->
  <ellipse cx="470" cy="460" rx="20" ry="10" fill="#c9c9c9"/>
  <ellipse cx="470" cy="460" rx="9" ry="5" fill="#efe6d8"/>
</svg>
