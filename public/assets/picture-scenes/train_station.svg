<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbcfa0"/>
      <stop offset="100%" stop-color="#f7e6c4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky1)"/>

  <!-- station roof structure -->
  <rect x="0" y="60" width="800" height="18" fill="#5b4636"/>
  <rect x="40" y="20" width="16" height="60" fill="#5b4636"/>
  <rect x="380" y="20" width="16" height="60" fill="#5b4636"/>
  <rect x="720" y="20" width="16" height="60" fill="#5b4636"/>

  <!-- platform -->
  <rect x="0" y="330" width="800" height="170" fill="#9a9a9a"/>
  <rect x="0" y="330" width="800" height="10" fill="#c7c7c7"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#7c7c7c" stroke-width="3"/>

  <!-- train -->
  <rect x="430" y="150" width="380" height="190" rx="14" fill="#d0021b"/>
  <rect x="430" y="150" width="380" height="40" rx="14" fill="#f2f2f2"/>
  <g fill="#bfe6f5">
    <rect x="460" y="205" width="55" height="60" rx="6"/>
    <rect x="535" y="205" width="55" height="60" rx="6"/>
    <rect x="610" y="205" width="55" height="60" rx="6"/>
    <rect x="685" y="205" width="55" height="60" rx="6"/>
    <rect x="760" y="205" width="40" height="60" rx="6"/>
  </g>
  <rect x="430" y="330" width="380" height="14" fill="#2b2b2b"/>

  <!-- food cart -->
  <g>
    <rect x="70" y="300" width="110" height="60" rx="6" fill="#e01010"/>
    <rect x="70" y="290" width="110" height="14" fill="#ffffff"/>
    <path d="M75 290 Q125 240 175 290 Z" fill="#ffd166"/>
    <circle cx="90" cy="368" r="10" fill="#333"/>
    <circle cx="160" cy="368" r="10" fill="#333"/>
    <!-- steam -->
    <path d="M120 280 q6 -14 0 -26" stroke="#fff" stroke-width="4" fill="none" opacity="0.7"/>
    <path d="M140 280 q6 -14 0 -26" stroke="#fff" stroke-width="4" fill="none" opacity="0.7"/>
  </g>

  <!-- vendor behind cart -->
  <g>
    <circle cx="95" cy="255" r="18" fill="#e8b48c"/>
    <rect x="75" y="270" width="40" height="45" rx="10" fill="#3a7d6b"/>
  </g>

  <!-- rushing commuters -->
  <g>
    <circle cx="260" cy="270" r="16" fill="#e8b48c"/>
    <rect x="243" y="284" width="34" height="55" rx="10" fill="#2b3a67"/>
    <rect x="225" y="300" width="16" height="26" rx="4" fill="#5b4636"/>
  </g>
  <g>
    <circle cx="320" cy="265" r="16" fill="#caa06a"/>
    <rect x="303" y="279" width="34" height="58" rx="10" fill="#c94c4c"/>
  </g>
  <g>
    <circle cx="370" cy="272" r="15" fill="#e8b48c"/>
    <rect x="354" y="285" width="32" height="52" rx="10" fill="#4a4a4a"/>
    <rect x="340" y="300" width="14" height="22" rx="4" fill="#333"/>
  </g>
  <g>
    <circle cx="205" cy="278" r="15" fill="#caa06a"/>
    <rect x="189" y="291" width="32" height="50" rx="10" fill="#f2a154"/>
  </g>

  <!-- clock -->
  <circle cx="400" cy="110" r="26" fill="#fff" stroke="#5b4636" stroke-width="4"/>
  <line x1="400" y1="110" x2="400" y2="94" stroke="#333" stroke-width="3"/>
  <line x1="400" y1="110" x2="412" y2="112" stroke="#333" stroke-width="3"/>
</svg>
