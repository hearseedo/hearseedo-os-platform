<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd0e8"/>
      <stop offset="100%" stop-color="#e3f4ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky4)"/>

  <!-- sun -->
  <circle cx="680" cy="90" r="40" fill="#ffe08a"/>

  <!-- distant mountains / valley -->
  <path d="M0 260 L120 160 L230 250 L340 140 L460 260 L560 190 L680 260 L800 200 L800 500 L0 500 Z" fill="#9bb6c9" opacity="0.6"/>
  <path d="M0 320 L150 240 L300 330 L420 230 L560 320 L700 250 L800 310 L800 500 L0 500 Z" fill="#7fae7f" opacity="0.85"/>

  <!-- main trail mountain -->
  <path d="M120 500 L340 130 L620 500 Z" fill="#5c8a5c"/>
  <path d="M300 220 L340 130 L390 235 Z" fill="#e9eef2"/>

  <!-- trail path -->
  <path d="M180 500 Q260 400 230 340 Q210 290 280 260 Q330 240 340 200" stroke="#c9a876" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- trees -->
  <g fill="#3f6b3f">
    <path d="M90 380 L110 330 L130 380 Z"/>
    <path d="M100 400 L120 345 L140 400 Z"/>
    <path d="M540 400 L565 340 L590 400 Z"/>
    <path d="M600 420 L622 365 L644 420 Z"/>
  </g>
  <g fill="#5b4636">
    <rect x="106" y="380" width="8" height="20"/>
    <rect x="565" y="400" width="8" height="20"/>
  </g>

  <!-- hikers on the trail -->
  <g>
    <circle cx="255" cy="320" r="14" fill="#e8b48c"/>
    <rect x="242" y="333" width="26" height="40" rx="9" fill="#e01010"/>
    <rect x="248" y="330" width="16" height="20" rx="4" fill="#8a6f4c"/>
    <rect x="230" y="365" width="12" height="24" fill="#3a3a3a"/>
    <rect x="262" y="365" width="12" height="24" fill="#3a3a3a"/>
  </g>
  <g>
    <circle cx="290" cy="300" r="13" fill="#caa06a"/>
    <rect x="278" y="312" width="24" height="38" rx="9" fill="#2ec4b6"/>
    <rect x="283" y="309" width="14" height="18" rx="4" fill="#5b4636"/>
    <rect x="266" y="345" width="11" height="22" fill="#333"/>
    <rect x="296" y="345" width="11" height="22" fill="#333"/>
  </g>
  <g>
    <circle cx="320" cy="270" r="13" fill="#f0c49a"/>
    <rect x="308" y="282" width="24" height="38" rx="9" fill="#f2a154"/>
    <rect x="298" y="315" width="11" height="22" fill="#3a3a3a"/>
    <rect x="328" y="315" width="11" height="22" fill="#3a3a3a"/>
  </g>

  <!-- birds -->
  <path d="M600 100 q10 -10 20 0 q10 -10 20 0" stroke="#333" stroke-width="2" fill="none"/>
  <path d="M650 130 q8 -8 16 0 q8 -8 16 0" stroke="#333" stroke-width="2" fill="none"/>
</svg>
