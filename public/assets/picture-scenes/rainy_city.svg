<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7c8a9c"/>
      <stop offset="100%" stop-color="#aab4bf"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky3)"/>

  <!-- buildings -->
  <g fill="#5b6570">
    <rect x="0" y="120" width="140" height="230"/>
    <rect x="150" y="80" width="160" height="270"/>
    <rect x="320" y="140" width="120" height="210"/>
    <rect x="450" y="60" width="150" height="290"/>
    <rect x="610" y="110" width="190" height="240"/>
  </g>
  <g fill="#8f99a3" opacity="0.6">
    <rect x="20" y="150" width="20" height="26"/>
    <rect x="60" y="150" width="20" height="26"/>
    <rect x="100" y="150" width="20" height="26"/>
    <rect x="180" y="110" width="20" height="26"/>
    <rect x="220" y="110" width="20" height="26"/>
    <rect x="260" y="110" width="20" height="26"/>
    <rect x="470" y="90" width="20" height="26"/>
    <rect x="510" y="90" width="20" height="26"/>
    <rect x="550" y="90" width="20" height="26"/>
    <rect x="640" y="140" width="20" height="26"/>
    <rect x="680" y="140" width="20" height="26"/>
    <rect x="720" y="140" width="20" height="26"/>
  </g>

  <!-- street -->
  <rect x="0" y="350" width="800" height="150" fill="#3d4247"/>
  <g stroke="#cfd6db" stroke-width="4" stroke-dasharray="24 20">
    <line x1="0" y1="420" x2="800" y2="420"/>
  </g>

  <!-- crosswalk -->
  <g fill="#cfd6db" opacity="0.85">
    <rect x="320" y="360" width="24" height="120"/>
    <rect x="360" y="360" width="24" height="120"/>
    <rect x="400" y="360" width="24" height="120"/>
    <rect x="440" y="360" width="24" height="120"/>
  </g>

  <!-- rain -->
  <g stroke="#dfe8ee" stroke-width="2" opacity="0.7">
    <line x1="60" y1="40" x2="40" y2="90"/>
    <line x1="160" y1="20" x2="140" y2="70"/>
    <line x1="260" y1="60" x2="240" y2="110"/>
    <line x1="360" y1="30" x2="340" y2="80"/>
    <line x1="460" y1="10" x2="440" y2="60"/>
    <line x1="560" y1="50" x2="540" y2="100"/>
    <line x1="660" y1="30" x2="640" y2="80"/>
    <line x1="740" y1="60" x2="720" y2="110"/>
    <line x1="500" y1="200" x2="485" y2="240"/>
    <line x1="600" y1="220" x2="585" y2="260"/>
    <line x1="200" y1="220" x2="185" y2="260"/>
  </g>

  <!-- people crossing with umbrellas -->
  <g>
    <path d="M330 390 a24 24 0 0 1 48 0 Z" fill="#e01010"/>
    <line x1="354" y1="390" x2="354" y2="430" stroke="#333" stroke-width="3"/>
    <circle cx="354" cy="440" r="9" fill="#e8b48c"/>
    <rect x="345" y="449" width="18" height="30" rx="6" fill="#2b3a67"/>
  </g>
  <g>
    <path d="M390 400 a22 22 0 0 1 44 0 Z" fill="#2ec4b6"/>
    <line x1="412" y1="400" x2="412" y2="436" stroke="#333" stroke-width="3"/>
    <circle cx="412" cy="446" r="8" fill="#caa06a"/>
    <rect x="404" y="454" width="16" height="26" rx="6" fill="#3a3a3a"/>
  </g>
  <g>
    <path d="M420 385 a24 24 0 0 1 48 0 Z" fill="#ffd166"/>
    <line x1="444" y1="385" x2="444" y2="428" stroke="#333" stroke-width="3"/>
    <circle cx="444" cy="438" r="9" fill="#e8b48c"/>
    <rect x="435" y="447" width="18" height="30" rx="6" fill="#5b4636"/>
  </g>

  <!-- puddle reflections -->
  <ellipse cx="200" cy="460" rx="40" ry="8" fill="#5b6570" opacity="0.5"/>
  <ellipse cx="600" cy="470" rx="50" ry="8" fill="#5b6570" opacity="0.5"/>
</svg>
