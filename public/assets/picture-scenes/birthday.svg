<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#aee1f9"/>
      <stop offset="100%" stop-color="#e7f7ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sky2)"/>
  <rect y="360" width="800" height="140" fill="#8ecb7a"/>
  <rect y="350" width="800" height="12" fill="#79b967"/>

  <!-- fence -->
  <g fill="#c9a876">
    <rect x="0" y="300" width="10" height="60"/>
    <rect x="60" y="300" width="10" height="60"/>
    <rect x="120" y="300" width="10" height="60"/>
    <rect x="0" y="310" width="130" height="10"/>
  </g>

  <!-- balloons -->
  <g>
    <circle cx="130" cy="150" r="28" fill="#e01010"/>
    <line x1="130" y1="178" x2="130" y2="240" stroke="#999" stroke-width="2"/>
    <circle cx="190" cy="120" r="24" fill="#2ec4b6"/>
    <line x1="190" y1="144" x2="190" y2="230" stroke="#999" stroke-width="2"/>
    <circle cx="640" cy="140" r="26" fill="#f2a154"/>
    <line x1="640" y1="166" x2="640" y2="235" stroke="#999" stroke-width="2"/>
    <circle cx="695" cy="110" r="22" fill="#8b5cf6"/>
    <line x1="695" y1="132" x2="695" y2="225" stroke="#999" stroke-width="2"/>
  </g>

  <!-- banner -->
  <path d="M260 90 L540 90 L520 130 L280 130 Z" fill="#ffd166"/>
  <text x="400" y="118" font-family="sans-serif" font-size="26" font-weight="700" fill="#5b4636" text-anchor="middle">HAPPY BIRTHDAY</text>

  <!-- table with cake -->
  <rect x="330" y="330" width="140" height="16" fill="#c9a876"/>
  <rect x="340" y="346" width="10" height="40" fill="#8a6f4c"/>
  <rect x="450" y="346" width="10" height="40" fill="#8a6f4c"/>
  <g>
    <rect x="368" y="290" width="64" height="40" rx="4" fill="#f6b8c7"/>
    <rect x="368" y="278" width="64" height="14" rx="4" fill="#fce3ea"/>
    <line x1="380" y1="278" x2="380" y2="264" stroke="#e01010" stroke-width="3"/>
    <line x1="400" y1="278" x2="400" y2="260" stroke="#2ec4b6" stroke-width="3"/>
    <line x1="420" y1="278" x2="420" y2="264" stroke="#f2a154" stroke-width="3"/>
    <circle cx="380" cy="260" r="3" fill="#ffd166"/>
    <circle cx="400" cy="256" r="3" fill="#ffd166"/>
    <circle cx="420" cy="260" r="3" fill="#ffd166"/>
  </g>

  <!-- kids playing (tag / running) -->
  <g>
    <circle cx="150" cy="330" r="17" fill="#e8b48c"/>
    <rect x="132" y="345" width="36" height="45" rx="10" fill="#2ec4b6"/>
    <rect x="120" y="380" width="16" height="30" fill="#3a3a3a"/>
    <rect x="164" y="380" width="16" height="30" fill="#3a3a3a"/>
  </g>
  <g>
    <circle cx="220" cy="345" r="16" fill="#caa06a"/>
    <rect x="203" y="360" width="34" height="42" rx="10" fill="#f2a154"/>
    <rect x="192" y="392" width="14" height="26" fill="#3a3a3a"/>
    <rect x="234" y="392" width="14" height="26" fill="#3a3a3a"/>
  </g>
  <g>
    <circle cx="580" cy="335" r="16" fill="#e8b48c"/>
    <rect x="563" y="350" width="34" height="44" rx="10" fill="#8b5cf6"/>
    <rect x="551" y="384" width="14" height="28" fill="#3a3a3a"/>
    <rect x="595" y="384" width="14" height="28" fill="#3a3a3a"/>
  </g>
  <g>
    <circle cx="640" cy="350" r="15" fill="#f0c49a"/>
    <rect x="624" y="364" width="32" height="40" rx="10" fill="#e01010"/>
    <rect x="612" y="394" width="14" height="24" fill="#3a3a3a"/>
    <rect x="652" y="394" width="14" height="24" fill="#3a3a3a"/>
  </g>

  <!-- confetti -->
  <g fill="#e01010">
    <rect x="260" y="160" width="6" height="6"/>
    <rect x="520" y="200" width="6" height="6"/>
  </g>
  <g fill="#2ec4b6">
    <rect x="300" y="140" width="6" height="6"/>
    <rect x="470" y="170" width="6" height="6"/>
  </g>
</svg>
