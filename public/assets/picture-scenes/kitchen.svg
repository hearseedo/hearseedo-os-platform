<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#2a2320"/>
  <rect y="0" width="800" height="60" fill="#1a1512"/>

  <!-- tiled wall -->
  <g stroke="#3d332c" stroke-width="1">
    <rect x="0" y="60" width="800" height="200" fill="#4a3f37"/>
  </g>
  <g fill="#4a3f37">
    <rect x="0" y="0" width="800" height="0"/>
  </g>

  <!-- hanging pots -->
  <g fill="#c7c7c7">
    <rect x="90" y="70" width="10" height="30"/>
    <circle cx="95" cy="110" r="22"/>
    <rect x="200" y="70" width="10" height="24"/>
    <circle cx="205" cy="102" r="18"/>
    <rect x="600" y="70" width="10" height="24"/>
    <circle cx="605" cy="102" r="18"/>
    <rect x="700" y="70" width="10" height="30"/>
    <circle cx="705" cy="110" r="22"/>
  </g>

  <!-- stove line stations -->
  <rect x="0" y="330" width="800" height="20" fill="#1a1512"/>
  <rect x="0" y="260" width="800" height="70" fill="#5a5a5a"/>
  <g fill="#333">
    <circle cx="150" cy="290" r="24"/>
    <circle cx="260" cy="290" r="24"/>
    <circle cx="370" cy="290" r="24"/>
    <circle cx="480" cy="290" r="24"/>
    <circle cx="590" cy="290" r="24"/>
  </g>
  <g fill="#f2a154" opacity="0.85">
    <circle cx="150" cy="290" r="12"/>
    <circle cx="480" cy="290" r="12"/>
  </g>

  <!-- flames / steam -->
  <path d="M150 278 q4 -10 0 -18 q4 8 0 18" fill="#f2a154"/>
  <path d="M370 250 q6 -16 0 -28" stroke="#eee" stroke-width="5" fill="none" opacity="0.6"/>
  <path d="M480 250 q6 -16 0 -28" stroke="#eee" stroke-width="5" fill="none" opacity="0.6"/>

  <!-- chefs moving between stations -->
  <g>
    <circle cx="150" cy="220" r="17" fill="#e8b48c"/>
    <rect x="140" y="200" width="20" height="10" rx="4" fill="#fff"/>
    <rect x="132" y="234" width="36" height="55" rx="10" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="300" cy="230" r="16" fill="#caa06a"/>
    <rect x="291" y="211" width="18" height="10" rx="4" fill="#fff"/>
    <rect x="283" y="244" width="34" height="50" rx="10" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="470" cy="225" r="16" fill="#8a5a3c"/>
    <rect x="461" y="206" width="18" height="10" rx="4" fill="#fff"/>
    <rect x="453" y="239" width="34" height="52" rx="10" fill="#ffffff"/>
  </g>
  <g>
    <circle cx="630" cy="222" r="17" fill="#e8b48c"/>
    <rect x="620" y="202" width="20" height="10" rx="4" fill="#fff"/>
    <rect x="612" y="236" width="36" height="54" rx="10" fill="#ffffff"/>
  </g>

  <!-- pass window with order tickets -->
  <rect x="0" y="380" width="800" height="120" fill="#3a2f28"/>
  <rect x="40" y="392" width="720" height="10" fill="#8a6f4c"/>
  <g fill="#fff">
    <rect x="60" y="380" width="26" height="18" rx="2"/>
    <rect x="100" y="380" width="26" height="18" rx="2"/>
    <rect x="140" y="380" width="26" height="18" rx="2"/>
  </g>
</svg>
